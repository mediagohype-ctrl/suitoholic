# Render blueprint for the Suitoholic API (server/).
# Render dashboard → New → Blueprint → pick this repo. Render reads this file and creates the
# service; it then asks you for the values marked sync: false (copy them from server/.env).
services:
  - type: web
    name: suitoholic-api
    runtime: node
    region: ohio            # same AWS region as the Neon database (us-east-2) for fast queries
    plan: starter           # "free" works too, but free instances sleep after 15 min of no traffic
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "10000"
      - key: AUTO_MIGRATE
        value: "true"
      - key: AUTO_SEED
        value: "true"
      - key: MAX_UPLOAD_MB
        value: "8"
      # Public address of this service, e.g. https://suitoholic-api.onrender.com (no trailing slash)
      - key: PUBLIC_URL
        sync: false
      # Storefront origins allowed to call the API, comma-separated. Wildcards are allowed:
      # https://suitoholic.vercel.app,https://*.vercel.app
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_NAME
        value: Suitoholic Admin
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
